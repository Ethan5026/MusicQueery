# MusicQueery companion (Linux): a silent sink that librespot plays into and `mqc` records from (its monitor).
# Nothing reaches a speaker. Installed to ~/.config/pipewire/pipewire.conf.d/ by companion/linux/install.sh.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = mqc_capture
      node.description = "MusicQueery capture (silent)"
      media.class      = Audio/Sink
      audio.position   = [ FL FR ]
      audio.rate       = 44100
      object.linger    = true
      priority.session = 0
      priority.driver  = 0
    }
  }
]
