[project]
name = "mqc"
version = "0.1.0"
description = "MusicQueery companion: captures Spotify per process, analyses beats/chords/keys, uploads Timeline v1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "soundfile>=0.13",
  "soxr>=0.5",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "psutil>=6.0",
  "torch>=2.5",
  "beat-this>=1.0",
  "mir-eval>=0.8",
  # chord recognisers voted together (D-34); vamp is built by scripts/build_chordino.py, BTC is fetched by hand (handoff)
  "madmom",
  "vamp>=1.1",
  "librosa>=0.10",
  "pyyaml>=6",
  "demucs>=4.1",
  "torchcrepe>=0.0.24",
]

[project.scripts]
mqc = "mqc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqc"]

# The companion runs on Windows (WASAPI capture, D-33) and Linux x86-64 (librespot + PipeWire, the mini PC);
# not macOS: demucs pins numpy<2 on Intel macOS.
[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

# CPU torch keeps the install small; analysis of one track takes seconds either way.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
# madmom 0.16.1 on PyPI does not build on 3.12
madmom = { git = "https://github.com/CPJKU/madmom" }
# Windows: built by scripts/build_chordino.py (the PyPI sdist does not compile with MSVC). Linux: the PyPI sdist.
vamp = [
  { path = ".wheels/vamp-1.1.0-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" },
  { index = "pypi", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.extra-build-dependencies]
madmom = ["numpy", "cython"]
vamp = ["numpy"]  # the sdist imports numpy in setup.py without declaring it

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
